    <h1>Формы</h1>
    <h2>1. Контактные данные</h2>
   
    <form action="https://formspree.io/f/mnpjkpkz" method="POST" target="_blank">
        
        <label>Фамилия: <input type="text" name="last_name" required></label>
        <label>Имя: <input type="text" name="first_name" required></label>
        
        <label>Группа: <input type="text" name="student_group" required></label>
        <label>Мобильный телефон: <input type="tel" name="phone" required></label>
        <label>Электронная почта: <input type="email" name="email" required></label>
        
        <label>Дата отправки: <input type="date" name="send_date" required></label>
        
        <br>
        <input type="submit" value="Отправить контакты">
        <input type="reset" value="Очистить">
    </form>

    <hr>

    <h2>2. Заказ книги и отзыв</h2>
    <form action="https://formspree.io/f/mnpjkpkz" method="POST" target="_blank">
        
        <label>Ваше имя (для заказа): <input type="text" name="customer_name" required></label>
        
        <label>Количество экземпляров: <input type="number" name="book_count" min="1" max="10" value="1" required></label>
        
        <label>Формат книги:</label>
        <label><input type="radio" name="book_format" value="paper" checked> Бумажная</label>
        <label><input type="radio" name="book_format" value="electronic"> Электронная</label>

        <label>Дополнительно:</label>
        <label><input type="checkbox" name="add_audiobook" value="yes"> Добавить аудиоверсию</label>
        <label><input type="checkbox" name="add_postcard" value="yes"> Открытка в подарок</label>

        <label>Желаемая дата доставки: <input type="date" name="delivery_date"></label>
        
        <label>Пароль для личного кабинета (если нужно): <input type="password" name="user_password"></label>
        
        <input type="hidden" name="order_source" value="website_lawrence">
        
    
        <label>Ваш отзыв: <input type="text" name="feedback" value="Только пожалуйста не присылайте Семь столпов мудрости!"></label>

        <br>
        <input type="submit" value="Оформить заказ">
        <input type="reset" value="Очистить">
    </form>
